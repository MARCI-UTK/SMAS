<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url('https://cdn.wallpapersafari.com/29/56/szcxqd.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div class="flex min-h-screen flex-col justify-center px-6 py-6">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm bg-zinc-900/60 rounded-lg p-4 shadow-xl backdrop-blur-sm">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Tennessee_Volunteers_logo.svg/1200px-Tennessee_Volunteers_logo.svg.png"
        alt="Tennessee Volunteers"
        class="mx-auto h-10 w-auto"
      />

      <h2 class="mt-4 text-center text-2xl font-bold tracking-tight text-white">
        Sign in to your account
      </h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="mt-4 rounded-md bg-red-950/80 px-3 py-2 text-sm text-red-100">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST" class="mt-5 space-y-6">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-100">Username</label>
          <div class="mt-2">
            <input
              id="username"
              type="text"
              name="username"
              required
              autocomplete="username"
              class="block w-full rounded-md border-0 bg-white/10 px-3 py-2 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 sm:text-sm"
            />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-gray-100">Password</label>
            <div class="text-sm">
              <a href="#" class="font-semibold text-orange-400 hover:text-orange-300">Forgot password?</a>
            </div>
          </div>
          <div class="mt-2">
            <input
              id="password"
              type="password"
              name="password"
              required
              autocomplete="current-password"
              class="block w-full rounded-md border-0 bg-white/10 px-3 py-2 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 sm:text-sm"
            />
          </div>
        </div>

        <div>
          <button
            type="submit"
            class="flex w-full justify-center rounded-md bg-orange-500 px-3 py-2 text-sm font-semibold text-white hover:bg-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
          >
            Sign in
          </button>
        </div>
      </form>

      <p class="mt-4 text-center">
        <a href="#" class="font-semibold text-white hover:text-orange-300">Create a new account</a>
      </p>
    </div>
  </div>
</body>
</html>

{% extends 'base.html' %}{% block content %}<div class="card"><h1>{{run.player.athlete_name}}</h1><h2 id="stage">{{run.stage}}</h2><p class="muted">This page will open the report automatically when processing finishes.</p><div id="error"></div></div>{% endblock %}{% block scripts %}<script>const id={{run.public_id|tojson}};async function poll(){const x=await fetch(`/api/runs/${id}`).then(r=>r.json());document.getElementById('stage').textContent=x.stage;if(x.status==='complete'){location.href=x.report_url;return}if(x.status==='failed'){const box=document.createElement('div');box.className='flash';box.textContent=x.error_message;document.getElementById('error').replaceChildren(box);return}setTimeout(poll,3000)}poll();</script>{% endblock %}

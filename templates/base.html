<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SMAS{% endblock %}</title><style>
:root{--orange:#ff8200;--dark:#262626;--gray:#52525b;--light:#f4f4f5;--border:#d4d4d8;--danger:#b42318;--ok:#247a45}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:var(--dark)}nav{background:var(--dark);padding:14px 24px;display:flex;justify-content:space-between}nav a{color:white;text-decoration:none;font-weight:700}.brand{color:var(--orange)}main{max-width:1250px;margin:auto;padding:24px}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}button,.button{background:var(--orange);color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:var(--gray)!important}input,textarea,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px}label{display:block;font-weight:700;margin:10px 0 5px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}.tab-btn{background:#71717a}.tab-btn.active{background:var(--orange)}.tab{display:none}.tab.active{display:block}.metric{border:1px solid var(--border);border-left:5px solid var(--ok);padding:13px;border-radius:9px;margin:10px 0}.metric.fail{border-left-color:var(--danger)}.score{font-size:44px;font-weight:900;color:var(--orange)}.muted{color:#6b7280}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border)}img.report{max-width:100%;border-radius:8px;border:1px solid var(--border)}.flash{padding:12px;background:#fff1e6;border-left:5px solid var(--orange);margin-bottom:12px}
</style>{% block head %}{% endblock %}</head><body>{% if session.get('auth') %}<nav><a class="brand" href="{{url_for('dashboard')}}">UTK Football SMAS</a><form method="post" action="{{url_for('logout')}}"><button class="secondary">Log out</button></form></nav>{% endif %}<main>{% with ms=get_flashed_messages() %}{% for m in ms %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
